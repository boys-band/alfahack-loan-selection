server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Avoid logging application IDs, query strings or other user data.
    access_log off;

    location = /health/live { return 200 'ok\n'; }
    location ~ ^/api/v2/admin/products(?:/|$) {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://catalog:8002;
    }
    location ~ ^/api/v2/products(?:/|$) {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://catalog:8002;
    }
    location ~ ^/api/v2/(?:companies|applications|staff)(?:/|$) {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://applications:8001;
    }
    location /api/ { return 404; }
    location / { proxy_pass http://frontend:3000; }
}
