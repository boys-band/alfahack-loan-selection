services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-admin-only}
      APPLICATIONS_DB_PASSWORD: ${APPLICATIONS_DB_PASSWORD:-demo-applications-only}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-demo-catalog-only}
      VERIFICATION_DB_PASSWORD: ${VERIFICATION_DB_PASSWORD:-demo-verification-only}
      DECISION_DB_PASSWORD: ${DECISION_DB_PASSWORD:-demo-decision-only}
      AGREEMENTS_DB_PASSWORD: ${AGREEMENTS_DB_PASSWORD:-demo-agreements-only}
      DISBURSEMENT_DB_PASSWORD: ${DISBURSEMENT_DB_PASSWORD:-demo-disbursement-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./bootstrap.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
      - ./:/schema/database:ro
      - ../services:/schema/services:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(cat /proc/1/comm)" = postgres &&
          pg_isready -U postgres -d alfa_disbursement &&
          psql -U postgres -d alfa_disbursement -Atqc
          "SELECT 1 FROM schema_migrations WHERE version = '001_initial' AND seeded_at IS NOT NULL" | grep -qx 1
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [database]
volumes:
  postgres-data:
networks:
  database:
