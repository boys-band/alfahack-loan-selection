plugins {
    id 'com.diffplug.spotless' version '8.0.0'
    id 'java'
    id 'application'
}
group = 'ru.alfa'
version = '1.0.0'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
application { mainClass = 'ru.alfa.verification.Main' }
dependencies {
    implementation platform('com.fasterxml.jackson:jackson-bom:2.19.2')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'com.networknt:json-schema-validator:1.5.9'
    implementation 'org.postgresql:postgresql:42.7.8'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
dependencyLocking { lockAllConfigurations() }
test { useJUnitPlatform { excludeTags 'integration' } }
tasks.register('integrationTest', Test) {
    description = 'HTTP and real PostgreSQL tests (tests/integration.py sets up the database)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter test
}
tasks.withType(Test).configureEach { testLogging { events 'passed', 'skipped', 'failed' } }

// Keep the formatter/version identical in all independent service builds.
spotless {
    java {
        if (providers.gradleProperty('formatFiles').isPresent()) {
            target new groovy.json.JsonSlurper().parseText(providers.gradleProperty('formatFiles').get())
        } else {
            target 'src/*/java/**/*.java', 'tests/unit/**/*.java', 'tests/integration/**/*.java'
        }
        googleJavaFormat('1.28.0')
        encoding 'UTF-8'
        lineEndings 'UNIX'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
