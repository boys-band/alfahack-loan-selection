services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: alfa_verification
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-admin-only}
      VERIFICATION_DB_PASSWORD: ${VERIFICATION_DB_PASSWORD:-demo-verification-only}
    volumes:
      - verification-data:/var/lib/postgresql/data
      - ./database/init.sh:/docker-entrypoint-initdb.d/10-verification.sh:ro
      - ./migrations:/verification/migrations:ro
      - ./tests/seed.sql:/verification/seed.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'test "$$(cat /proc/1/comm)" = postgres && pg_isready -U postgres -d alfa_verification && psql -U postgres -d alfa_verification -Atqc "SELECT 1 FROM schema_migrations WHERE version=''002_source_snapshots'' AND seeded_at IS NOT NULL" | grep -qx 1']
      interval: 2s
      timeout: 3s
      retries: 40
  verification:
    build:
      context: .
      additional_contexts:
        gradle-dist: ../../gradle-dist
    environment:
      DATABASE_URL: postgresql://verification_app:${VERIFICATION_DB_PASSWORD:-demo-verification-only}@postgres:5432/alfa_verification
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-demo-internal-verification-only}
      PORT: 8003
    ports: ['127.0.0.1:8003:8003']
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  verification-data:
