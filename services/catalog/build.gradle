plugins {
    id 'com.diffplug.spotless' version '8.0.0'
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'ru.alfa'
version = '2.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
application { mainClass = 'ru.alfa.catalog.Main' }

dependencies {
    implementation platform('com.fasterxml.jackson:jackson-bom:2.18.3')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'com.zaxxer:HikariCP:6.3.0'
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'org.slf4j:slf4j-nop:2.0.17'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.networknt:json-schema-validator:1.5.6'
    testImplementation 'org.yaml:snakeyaml:2.4'
}

dependencyLocking { lockAllConfigurations() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    exclude '**/*IT.class'
}
tasks.register('integrationTest', Test) {
    description = 'HTTP tests with an isolated real PostgreSQL container'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class'
    shouldRunAfter test
    outputs.upToDateWhen { false }
}
tasks.named('shadowJar') {
    archiveFileName = 'catalog.jar'
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    manifest { attributes 'Main-Class': application.mainClass.get() }
}
tasks.named('jar') { archiveClassifier = 'plain' }
tasks.named('assemble') { dependsOn tasks.named('shadowJar') }

// Keep the formatter/version identical in all independent service builds.
spotless {
    java {
        if (providers.gradleProperty('formatFiles').isPresent()) {
            target new groovy.json.JsonSlurper().parseText(providers.gradleProperty('formatFiles').get())
        } else {
            target 'src/*/java/**/*.java', 'tests/unit/**/*.java', 'tests/integration/**/*.java'
        }
        googleJavaFormat('1.28.0')
        encoding 'UTF-8'
        lineEndings 'UNIX'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
