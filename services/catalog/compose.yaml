services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-admin-only}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-demo-catalog-only}
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./tests/bootstrap.sh:/docker-entrypoint-initdb.d/10-catalog.sh:ro
      - ./migrations:/schema/migrations:ro
      - ../../database/seeds/catalog.sql:/schema/seed.sql:ro
    healthcheck:
      test: [CMD-SHELL, "test \"$$(cat /proc/1/comm)\" = postgres && psql -U postgres -d alfa_catalog -Atqc \"SELECT 1 FROM schema_migrations WHERE seeded_at IS NOT NULL\" | grep -qx 1"]
      interval: 2s
      timeout: 3s
      retries: 40
  catalog:
    image: alfa-catalog:2.0.0
    build:
      context: .
      additional_contexts:
        gradle-dist: ../../gradle-dist
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://catalog_app:demo-catalog-only@postgres:5432/alfa_catalog}
      PORT: 8002
      DEMO_CUSTOMER_TOKEN: ${DEMO_CUSTOMER_TOKEN:-demo-customer-only}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-demo-internal-only}
      DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-demo-product-admin-only}
      DEMO_ADMIN_ID: ${DEMO_ADMIN_ID:-00000000-0000-4000-8000-000000000099}
    ports: ["127.0.0.1:${CATALOG_HTTP_PORT:-8002}:8002"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
volumes:
  catalog-data:
