$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  Uuid:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  Timestamp:
    type: string
    format: date-time
    pattern: Z$
  NonEmptyText:
    type: string
    minLength: 1
  Rubles:
    type: integer
    minimum: 0
    maximum: 1000000000000
  PositiveRubles:
    type: integer
    minimum: 1
    maximum: 1000000000
  PositiveVersion:
    type: integer
    minimum: 1
  ProductId:
    type: string
    pattern: ^[a-z][a-z0-9-]{1,63}$
  DocumentSha256:
    type: string
    pattern: ^[0-9a-f]{64}$
  Purpose:
    type: string
    enum:
    - WORKING_CAPITAL
    - EQUIPMENT
    - REFINANCING
  FinancialData:
    type: object
    additionalProperties: false
    properties:
      monthlyRevenueRub:
        $ref: '#/$defs/Rubles'
      monthlyExpensesRub:
        $ref: '#/$defs/Rubles'
      existingMonthlyDebtPaymentsRub:
        $ref: '#/$defs/Rubles'
    required:
    - monthlyRevenueRub
    - monthlyExpensesRub
    - existingMonthlyDebtPaymentsRub
  DraftFinancialData:
    type: object
    additionalProperties: false
    properties:
      monthlyRevenueRub:
        anyOf:
        - $ref: '#/$defs/Rubles'
        - type: 'null'
      monthlyExpensesRub:
        anyOf:
        - $ref: '#/$defs/Rubles'
        - type: 'null'
      existingMonthlyDebtPaymentsRub:
        anyOf:
        - $ref: '#/$defs/Rubles'
        - type: 'null'
    required:
    - monthlyRevenueRub
    - monthlyExpensesRub
    - existingMonthlyDebtPaymentsRub
  Company:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      legalName:
        $ref: '#/$defs/NonEmptyText'
      inn:
        type: string
        pattern: ^(\d{10}|\d{12})$
      legalForm:
        type: string
        enum:
        - IE
        - LLC
      registeredAt:
        type: string
        format: date
      settlementAccountId:
        $ref: '#/$defs/Uuid'
    required:
    - id
    - legalName
    - inn
    - legalForm
    - registeredAt
    - settlementAccountId
  Product:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/ProductId'
      version:
        type: string
        pattern: ^[1-9]\d*$
      name:
        $ref: '#/$defs/NonEmptyText'
      description:
        $ref: '#/$defs/NonEmptyText'
      purposeCodes:
        type: array
        items:
          $ref: '#/$defs/Purpose'
        minItems: 1
        uniqueItems: true
      minAmountRub:
        $ref: '#/$defs/PositiveRubles'
      maxAmountRub:
        $ref: '#/$defs/PositiveRubles'
      minTermMonths:
        type: integer
        minimum: 1
        maximum: 120
      maxTermMonths:
        type: integer
        minimum: 1
        maximum: 120
      annualRateBps:
        type: integer
        minimum: 0
        maximum: 10000
      minBusinessAgeMonths:
        type: integer
        minimum: 0
      maxDebtServiceRatioBps:
        type: integer
        minimum: 1
        maximum: 10000
    required:
    - id
    - version
    - name
    - description
    - purposeCodes
    - minAmountRub
    - maxAmountRub
    - minTermMonths
    - maxTermMonths
    - annualRateBps
    - minBusinessAgeMonths
    - maxDebtServiceRatioBps
  RiskFactor:
    type: object
    additionalProperties: false
    properties:
      code:
        type: string
        enum:
        - BASE
        - CREDIT_HISTORY
        - BUSINESS_AGE
        - DEBT_BURDEN
      points:
        type: integer
        minimum: 0
        maximum: 300
      description:
        $ref: '#/$defs/NonEmptyText'
    required:
    - code
    - points
    - description
  RiskAssessment:
    type: object
    additionalProperties: false
    properties:
      score:
        type: integer
        minimum: 300
        maximum: 900
      grade:
        type: string
        enum:
        - LOW
        - MEDIUM
        - HIGH
      factors:
        type: array
        items:
          $ref: '#/$defs/RiskFactor'
        minItems: 4
        maxItems: 4
      freeCashFlowRub:
        type: integer
        minimum: -1000000000000
        maximum: 1000000000000
      debtServiceRatioBps:
        anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
    required:
    - score
    - grade
    - factors
    - freeCashFlowRub
    - debtServiceRatioBps
  Problem:
    type: object
    additionalProperties: false
    properties:
      type:
        type: string
        format: uri
      title:
        $ref: '#/$defs/NonEmptyText'
      status:
        type: integer
        minimum: 400
        maximum: 599
      detail:
        $ref: '#/$defs/NonEmptyText'
      code:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      requestId:
        $ref: '#/$defs/Uuid'
      errors:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            path:
              type: string
              pattern: ^(/.*)?$
            message:
              $ref: '#/$defs/NonEmptyText'
          required:
          - path
          - message
    required:
    - type
    - title
    - status
    - detail
    - code
    - requestId
    - errors
  Health:
    type: object
    additionalProperties: false
    properties:
      status:
        const: ok
    required:
    - status
  ApplicationStatus:
    type: string
    enum:
    - DRAFT
    - SUBMITTED
    - VALIDATION
    - IN_REVIEW
    - NEEDS_INFO
    - MANUAL_REVIEW
    - OFFER_READY
    - OFFER_ACCEPTED
    - AWAITING_SIGNATURE
    - SIGNED
    - DISBURSING
    - DISBURSED
    - REJECTED
    - CANCELLED
    - EXPIRED
  ReviewStage:
    type: string
    enum:
    - ENRICHMENT
    - SCORING
  ProcessingStep:
    type: string
    enum:
    - VALIDATION
    - ENRICHMENT
    - SCORING
    - MANUAL_CASE
    - MANUAL_ACTION
    - AGREEMENT
    - SIGNATURE
    - PAYOUT_VALIDATION
    - DISBURSEMENT
    - CLOSURE
  AdditionalInfo:
    type: object
    additionalProperties: false
    properties:
      businessDescription:
        type: string
        minLength: 1
        maxLength: 2000
      revenueExplanation:
        type: string
        minLength: 1
        maxLength: 2000
      refinancedDebtRub:
        $ref: '#/$defs/Rubles'
    required: []
  SubmitRequest:
    type: object
    additionalProperties: false
    properties:
      personalDataConsent:
        const: true
      creditBureauConsent:
        const: true
    required:
    - personalDataConsent
    - creditBureauConsent
  Consents:
    type: object
    additionalProperties: false
    properties:
      personalDataConsent:
        const: true
      creditBureauConsent:
        const: true
      acceptedAt:
        $ref: '#/$defs/Timestamp'
    required:
    - personalDataConsent
    - creditBureauConsent
    - acceptedAt
  InfoRequirement:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
        pattern: ^/
      message:
        $ref: '#/$defs/NonEmptyText'
    required:
    - path
    - message
  InformationRequest:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      source:
        type: string
        enum:
        - VALIDATION
        - ENRICHMENT
        - SCORING
        - STAFF
      requirements:
        type: array
        items:
          $ref: '#/$defs/InfoRequirement'
        minItems: 1
      createdAt:
        $ref: '#/$defs/Timestamp'
      deadline:
        $ref: '#/$defs/Timestamp'
      status:
        type: string
        enum:
        - OPEN
        - ANSWERED
        - CLOSED
    required:
    - id
    - applicationId
    - dataVersion
    - source
    - requirements
    - createdAt
    - deadline
    - status
  VerificationFacts:
    type: object
    additionalProperties: false
    properties:
      registryStatus:
        type: string
        enum:
        - ACTIVE
        - INACTIVE
      registryRegisteredAt:
        type: string
        format: date
      businessAgeMonths:
        type: integer
        minimum: 0
      creditHistoryScore:
        type: integer
        minimum: 0
        maximum: 1000
      hasCurrentOverdue:
        type: boolean
      taxDebtRub:
        $ref: '#/$defs/Rubles'
    required:
    - registryStatus
    - registryRegisteredAt
    - businessAgeMonths
    - creditHistoryScore
    - hasCurrentOverdue
    - taxDebtRub
  FactsResolution:
    type: object
    additionalProperties: false
    properties:
      verificationId:
        $ref: '#/$defs/Uuid'
      confirmedFacts:
        $ref: '#/$defs/VerificationFacts'
    required:
    - verificationId
    - confirmedFacts
  StaffAttestation:
    type: object
    additionalProperties: false
    properties:
      caseActionId:
        $ref: '#/$defs/Uuid'
      staffId:
        $ref: '#/$defs/Uuid'
      reason:
        $ref: '#/$defs/NonEmptyText'
      recordedAt:
        $ref: '#/$defs/Timestamp'
      confirmedFacts:
        $ref: '#/$defs/VerificationFacts'
    required:
    - caseActionId
    - staffId
    - reason
    - recordedAt
    - confirmedFacts
  SubmittedData:
    type: object
    additionalProperties: false
    properties:
      company:
        $ref: '#/$defs/Company'
      product:
        $ref: '#/$defs/Product'
      amountRub:
        $ref: '#/$defs/PositiveRubles'
      termMonths:
        type: integer
        minimum: 1
        maximum: 120
      purpose:
        $ref: '#/$defs/Purpose'
      financialData:
        $ref: '#/$defs/FinancialData'
      additionalInfo:
        $ref: '#/$defs/AdditionalInfo'
      consents:
        $ref: '#/$defs/Consents'
      staffAttestation:
        anyOf:
        - $ref: '#/$defs/StaffAttestation'
        - type: 'null'
    required:
    - company
    - product
    - amountRub
    - termMonths
    - purpose
    - financialData
    - additionalInfo
    - consents
    - staffAttestation
  DataChanges:
    type: object
    additionalProperties: false
    properties:
      productId:
        $ref: '#/$defs/ProductId'
      productVersion:
        type: string
        pattern: ^[1-9][0-9]*$
      amountRub:
        $ref: '#/$defs/PositiveRubles'
      termMonths:
        type: integer
        minimum: 1
        maximum: 120
      purpose:
        $ref: '#/$defs/Purpose'
      financialData:
        $ref: '#/$defs/FinancialData'
      additionalInfo:
        $ref: '#/$defs/AdditionalInfo'
    required: []
    minProperties: 1
    allOf:
    - dependentRequired:
        productId:
        - productVersion
        productVersion:
        - productId
  DataVersion:
    type: object
    additionalProperties: false
    properties:
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      data:
        $ref: '#/$defs/SubmittedData'
      createdAt:
        $ref: '#/$defs/Timestamp'
      origin:
        type: string
        enum:
        - INITIAL_SUBMISSION
        - CUSTOMER_INFO
        - CUSTOMER_TERMS
        - STAFF_AMENDMENT
      actorId:
        $ref: '#/$defs/Uuid'
    required:
    - applicationId
    - dataVersion
    - data
    - createdAt
    - origin
    - actorId
  Finding:
    type: object
    additionalProperties: false
    properties:
      source:
        type: string
        enum:
        - REGISTRY
        - BKI
        - FNS
        - STAFF
      code:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      severity:
        type: string
        enum:
        - INFO
        - WARNING
        - BLOCK
      message:
        $ref: '#/$defs/NonEmptyText'
    required:
    - source
    - code
    - severity
    - message
  VerificationRequest:
    type: object
    additionalProperties: false
    properties:
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      data:
        $ref: '#/$defs/SubmittedData'
      asOf:
        $ref: '#/$defs/Timestamp'
    required:
    - applicationId
    - dataVersion
    - data
    - asOf
  VerificationResult:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      outcome:
        type: string
        enum:
        - COMPLETE
        - NEEDS_INFO
        - MANUAL_REVIEW
      asOf:
        $ref: '#/$defs/Timestamp'
      completedAt:
        $ref: '#/$defs/Timestamp'
      rawFacts:
        anyOf:
        - $ref: '#/$defs/VerificationFacts'
        - type: 'null'
      facts:
        anyOf:
        - $ref: '#/$defs/VerificationFacts'
        - type: 'null'
      confirmed:
        type: boolean
      requirements:
        type: array
        items:
          $ref: '#/$defs/InfoRequirement'
      findings:
        type: array
        items:
          $ref: '#/$defs/Finding'
    required:
    - id
    - applicationId
    - dataVersion
    - outcome
    - asOf
    - completedAt
    - rawFacts
    - facts
    - confirmed
    - requirements
    - findings
    allOf:
    - if:
        properties:
          outcome:
            const: COMPLETE
      then:
        properties:
          facts:
            $ref: '#/$defs/VerificationFacts'
          confirmed:
            const: true
          requirements:
            maxItems: 0
      else:
        properties:
          confirmed:
            const: false
    - if:
        properties:
          outcome:
            const: NEEDS_INFO
      then:
        properties:
          requirements:
            minItems: 1
  DecisionReasonCode:
    type: string
    enum:
    - REGISTRY_INACTIVE
    - CURRENT_OVERDUE
    - TAX_DEBT_LIMIT
    - BUSINESS_TOO_YOUNG
    - NON_POSITIVE_CASH_FLOW
    - DEBT_BURDEN_LIMIT
    - PRODUCT_LIMITS
    - RISK_SCORE_LOW
    - BORDERLINE_RISK
    - ADDITIONAL_INFORMATION_REQUIRED
    - APPROVED_BY_POLICY
    - APPROVED_BY_STAFF
    - REJECTED_BY_STAFF
  DecisionReason:
    type: object
    additionalProperties: false
    properties:
      code:
        $ref: '#/$defs/DecisionReasonCode'
      message:
        $ref: '#/$defs/NonEmptyText'
    required:
    - code
    - message
  EvaluatedTerms:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      amountRub:
        $ref: '#/$defs/PositiveRubles'
      termMonths:
        type: integer
        minimum: 1
        maximum: 120
      annualRateBps:
        type: integer
        minimum: 0
        maximum: 10000
      monthlyPaymentRub:
        $ref: '#/$defs/PositiveRubles'
      risk:
        $ref: '#/$defs/RiskAssessment'
      eligible:
        type: boolean
      reasons:
        type: array
        items:
          $ref: '#/$defs/DecisionReason'
    required:
    - id
    - amountRub
    - termMonths
    - annualRateBps
    - monthlyPaymentRub
    - risk
    - eligible
    - reasons
  Offer:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      version:
        const: 1
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      productId:
        $ref: '#/$defs/ProductId'
      productVersion:
        type: string
        pattern: ^[1-9][0-9]*$
      type:
        type: string
        enum:
        - REQUESTED
        - COUNTER
      termsId:
        $ref: '#/$defs/Uuid'
      amountRub:
        $ref: '#/$defs/PositiveRubles'
      termMonths:
        type: integer
        minimum: 1
        maximum: 120
      annualRateBps:
        type: integer
        minimum: 0
        maximum: 10000
      monthlyPaymentRub:
        $ref: '#/$defs/PositiveRubles'
      expiresAt:
        $ref: '#/$defs/Timestamp'
    required:
    - id
    - version
    - applicationId
    - dataVersion
    - productId
    - productVersion
    - type
    - termsId
    - amountRub
    - termMonths
    - annualRateBps
    - monthlyPaymentRub
    - expiresAt
  StaffAudit:
    type: object
    additionalProperties: false
    properties:
      staffId:
        $ref: '#/$defs/Uuid'
      actionId:
        $ref: '#/$defs/Uuid'
      reason:
        $ref: '#/$defs/NonEmptyText'
      decidedAt:
        $ref: '#/$defs/Timestamp'
    required:
    - staffId
    - actionId
    - reason
    - decidedAt
  DecisionRequest:
    type: object
    additionalProperties: false
    properties:
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      data:
        $ref: '#/$defs/SubmittedData'
      verification:
        allOf:
        - $ref: '#/$defs/VerificationResult'
        - properties:
            outcome:
              const: COMPLETE
            confirmed:
              const: true
    required:
    - applicationId
    - dataVersion
    - data
    - verification
  DecisionResult:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      kind:
        type: string
        enum:
        - AUTO
        - MANUAL
      policyVersion:
        const: demo-policy-v2
      evaluatedAt:
        $ref: '#/$defs/Timestamp'
      outcome:
        type: string
        enum:
        - APPROVED
        - REJECTED
        - NEEDS_INFO
        - MANUAL_REVIEW
      assessmentId:
        anyOf:
        - $ref: '#/$defs/Uuid'
        - type: 'null'
      risk:
        anyOf:
        - $ref: '#/$defs/RiskAssessment'
        - type: 'null'
      evaluatedTerms:
        type: array
        items:
          $ref: '#/$defs/EvaluatedTerms'
      selectedTermsId:
        anyOf:
        - $ref: '#/$defs/Uuid'
        - type: 'null'
      reasons:
        type: array
        items:
          $ref: '#/$defs/DecisionReason'
        minItems: 1
      requirements:
        type: array
        items:
          $ref: '#/$defs/InfoRequirement'
      offer:
        anyOf:
        - $ref: '#/$defs/Offer'
        - type: 'null'
      staffAudit:
        anyOf:
        - $ref: '#/$defs/StaffAudit'
        - type: 'null'
    required:
    - id
    - applicationId
    - dataVersion
    - kind
    - policyVersion
    - evaluatedAt
    - outcome
    - assessmentId
    - risk
    - evaluatedTerms
    - selectedTermsId
    - reasons
    - requirements
    - offer
    - staffAudit
    allOf:
    - if:
        properties:
          outcome:
            const: APPROVED
      then:
        properties:
          risk:
            $ref: '#/$defs/RiskAssessment'
          offer:
            $ref: '#/$defs/Offer'
          assessmentId:
            $ref: '#/$defs/Uuid'
          selectedTermsId:
            $ref: '#/$defs/Uuid'
          evaluatedTerms:
            minItems: 1
      else:
        properties:
          offer:
            type: 'null'
    - if:
        properties:
          outcome:
            const: NEEDS_INFO
      then:
        properties:
          requirements:
            minItems: 1
    - if:
        properties:
          kind:
            const: MANUAL
      then:
        properties:
          staffAudit:
            $ref: '#/$defs/StaffAudit'
      else:
        properties:
          staffAudit:
            type: 'null'
  ManualActionType:
    type: string
    enum:
    - APPROVE
    - REJECT
    - REQUEST_INFO
    - AMEND_DATA
  ManualReviewRequest:
    type: object
    additionalProperties: false
    properties:
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      data:
        $ref: '#/$defs/SubmittedData'
      verification:
        $ref: '#/$defs/VerificationResult'
      decision:
        anyOf:
        - $ref: '#/$defs/DecisionResult'
        - type: 'null'
      reason:
        $ref: '#/$defs/NonEmptyText'
    required:
    - applicationId
    - dataVersion
    - data
    - verification
    - decision
    - reason
    allOf:
    - anyOf:
      - properties:
          decision:
            allOf:
            - $ref: '#/$defs/DecisionResult'
            - properties:
                outcome:
                  const: MANUAL_REVIEW
          verification:
            properties:
              outcome:
                const: COMPLETE
              confirmed:
                const: true
      - properties:
          decision:
            type: 'null'
          verification:
            properties:
              outcome:
                const: MANUAL_REVIEW
  ManualReviewCase:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      applicationId:
        $ref: '#/$defs/Uuid'
      dataVersion:
        $ref: '#/$defs/PositiveVersion'
      verificationId:
        $ref: '#/$defs/Uuid'
      decisionId:
        anyOf:
        - $ref: '#/$defs/Uuid'
        - type: 'null'
      assessmentId:
        anyOf:
        - $ref: '#/$defs/Uuid'
        - type: 'null'
      status:
        type: string
        enum:
        - OPEN
        - RESOLVED
        - CLOSED
      reason:
        $ref: '#/$defs/NonEmptyText'
      allowedActions:
        type: array
        items:
          $ref: '#/$defs/ManualActionType'
        uniqueItems: true
      createdAt:
        $ref: '#/$defs/Timestamp'
    required:
    - id
    - applicationId
    - dataVersion
    - verificationId
    - decisionId
    - assessmentId
    - status
    - reason
    - allowedActions
    - createdAt
    allOf:
    - if:
        properties:
          assessmentId:
            type: 'null'
      then:
        properties:
          allowedActions:
            not:
              contains:
                const: APPROVE
    - if:
        properties:
          status:
            enum:
            - RESOLVED
            - CLOSED
      then:
        properties:
          allowedActions:
            maxItems: 0
  ManualReviewPage:
    type: object
    additionalProperties: false
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/ManualReviewCase'
      nextCursor:
        anyOf:
        - $ref: '#/$defs/NonEmptyText'
        - type: 'null'
    required:
    - items
    - nextCursor
  StaffReviewActionRequest:
    type: object
    additionalProperties: false
    properties:
      action:
        $ref: '#/$defs/ManualActionType'
      reason:
        type: string
        minLength: 10
        maxLength: 2000
      termsId:
        anyOf:
        - $ref: '#/$defs/Uuid'
        - type: 'null'
      requirements:
        type: array
        items:
          $ref: '#/$defs/InfoRequirement'
      changes:
        anyOf:
        - $ref: '#/$defs/DataChanges'
        - type: 'null'
      factsResolution:
        anyOf:
        - $ref: '#/$defs/FactsResolution'
        - type: 'null'
    required:
    - action
    - reason
    - termsId
    - requirements
    - changes
    - factsResolution
    allOf:
    - if:
        properties:
          action:
            const: APPROVE
      then:
        properties:
          termsId:
            $ref: '#/$defs/Uuid'
    - if:
        properties:
          action:
            const: REQUEST_INFO
      then:
        properties:
          requirements:
            minItems: 1
    - if:
        properties:
          action:
            const: AMEND_DATA
      then:
        anyOf:
        - properties:
            changes:
              $ref: '#/$defs/DataChanges'
        - properties:
            factsResolution:
              $ref: '#/$defs/FactsResolution'
    - if:
        properties:
          action:
            const: APPROVE
      then:
        properties:
          requirements:
            maxItems: 0
          changes:
            type: 'null'
          factsResolution:
            type: 'null'
    - if:
        properties:
          action:
            const: REJECT
      then:
        properties:
          termsId:
            type: 'null'
          requirements:
            maxItems: 0
          changes:
            type: 'null'
          factsResolution:
            type: 'null'
    - if:
        properties:
          action:
            const: REQUEST_INFO
      then:
        properties:
          termsId:
            type: 'null'
          changes:
            type: 'null'
          factsResolution:
            type: 'null'
    - if:
        properties:
          action:
            const: AMEND_DATA
      then:
        properties:
          termsId:
            type: 'null'
          requirements:
            maxItems: 0
