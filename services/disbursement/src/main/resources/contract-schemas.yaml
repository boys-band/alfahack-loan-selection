    - currency
    - status
    - creditEntryId
    - executedAt
  TechnicalError:
    type: object
    additionalProperties: false
    properties:
      step:
        $ref: '#/$defs/ProcessingStep'
      code:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      message:
        $ref: '#/$defs/NonEmptyText'
      attemptCount:
        type: integer
        minimum: 1
      lastAttemptAt:
        $ref: '#/$defs/Timestamp'
      retryable:
        type: boolean
    required:
    - step
    - code
    - message
    - attemptCount
    - lastAttemptAt
    - retryable
  Processing:
    type: object
    additionalProperties: false
    properties:
      step:
        $ref: '#/$defs/ProcessingStep'
      operationId:
        $ref: '#/$defs/Uuid'
      state:
        type: string
        enum:
        - PENDING
        - RUNNING
        - PAUSED
      attemptCount:
        type: integer
        minimum: 0
    required:
    - step
    - operationId
    - state
    - attemptCount
  Application:
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: '#/$defs/Uuid'
      customerId:
        $ref: '#/$defs/Uuid'
      version:
        $ref: '#/$defs/PositiveVersion'
      dataVersion:
        type: integer
        minimum: 0
      status:
        $ref: '#/$defs/ApplicationStatus'
      reviewStage:
        anyOf:
        - $ref: '#/$defs/ReviewStage'
        - type: 'null'
      company:
        $ref: '#/$defs/Company'
      product:
        $ref: '#/$defs/Product'
      amountRub:
        anyOf:
        - $ref: '#/$defs/PositiveRubles'
        - type: 'null'
      termMonths:
        anyOf:
        - type: integer
          minimum: 1
          maximum: 120
        - type: 'null'
      purpose:
        anyOf:
        - $ref: '#/$defs/Purpose'
        - type: 'null'
      financialData:
        anyOf:
        - $ref: '#/$defs/DraftFinancialData'
        - type: 'null'
      additionalInfo:
        $ref: '#/$defs/AdditionalInfo'
      consents:
        anyOf:
        - $ref: '#/$defs/Consents'
        - type: 'null'
      verification:
        anyOf:
        - $ref: '#/$defs/VerificationResult'
        - type: 'null'
      decision:
        anyOf:
        - $ref: '#/$defs/DecisionResult'
        - type: 'null'
      informationRequest:
        anyOf:
        - $ref: '#/$defs/InformationRequest'
        - type: 'null'
      manualReview:
        anyOf:
        - $ref: '#/$defs/ManualReviewCase'
        - type: 'null'
      acceptedOffer:
        anyOf:
        - $ref: '#/$defs/AcceptedOffer'
        - type: 'null'
      agreement:
        anyOf:
        - $ref: '#/$defs/AgreementSummary'
        - type: 'null'
      payoutInstruction:
        $ref: '#/$defs/PayoutInstruction'
      payoutCheck:
        anyOf:
        - $ref: '#/$defs/PayoutCheck'
        - type: 'null'
      disbursement:
        anyOf:
        - $ref: '#/$defs/Disbursement'
        - type: 'null'
      deadlineKind:
        anyOf:
        - type: string
          enum:
          - INFO
          - OFFER
          - SIGNATURE
        - type: 'null'
      actionDeadline:
        anyOf:
        - $ref: '#/$defs/Timestamp'
        - type: 'null'
      closureReason:
        anyOf:
        - type: string
          enum:
          - INFO_TIMEOUT
          - OFFER_TIMEOUT
          - SIGNATURE_TIMEOUT
          - CUSTOMER_CANCELLED
          - CREDIT_REJECTED
        - type: 'null'
      technicalError:
        anyOf:
        - $ref: '#/$defs/TechnicalError'
        - type: 'null'
      processing:
        anyOf:
        - $ref: '#/$defs/Processing'
        - type: 'null'
      availableActions:
        type: array
        items:
          type: string
          enum:
          - EDIT
          - SUBMIT
          - PROVIDE_INFO
          - CHANGE_TERMS
          - ACCEPT_OFFER
          - SIGN
          - CANCEL
          - UPDATE_PAYOUT_ACCOUNT
          - RETRY_PROCESSING
        uniqueItems: true
        description: Действия клиента-владельца; банковские действия определяет manualReview.allowedActions.
      nextActionHint:
        $ref: '#/$defs/NonEmptyText'
      createdAt:
        $ref: '#/$defs/Timestamp'
      updatedAt:
        $ref: '#/$defs/Timestamp'
    required:
    - id
    - customerId
    - version
    - dataVersion
    - status
    - reviewStage
    - company
    - product
    - amountRub
    - termMonths
    - purpose
    - financialData
    - additionalInfo
    - consents
    - verification
    - decision
    - informationRequest
    - manualReview
    - acceptedOffer
    - agreement
    - payoutInstruction
    - payoutCheck
    - disbursement
    - deadlineKind
    - actionDeadline
    - closureReason
    - technicalError
    - processing
    - availableActions
    - nextActionHint
    - createdAt
    - updatedAt
    allOf:
    - if:
        properties:
          status:
            const: IN_REVIEW
      then:
        properties:
          reviewStage:
            $ref: '#/$defs/ReviewStage'
      else:
        properties:
          reviewStage:
            type: 'null'
    - if:
        properties:
          status:
            const: DRAFT
      then:
        properties:
          dataVersion:
            const: 0
    - if:
        properties:
          status:
            not:
              enum:
              - DRAFT
              - CANCELLED
      then:
        properties:
          dataVersion:
            $ref: '#/$defs/PositiveVersion'
          amountRub:
            $ref: '#/$defs/PositiveRubles'
          termMonths:
            type: integer
            minimum: 1
            maximum: 120
          purpose:
            $ref: '#/$defs/Purpose'
          financialData:
            $ref: '#/$defs/FinancialData'
          consents:
            $ref: '#/$defs/Consents'
    - if:
        properties:
          status:
            const: NEEDS_INFO
      then:
        properties:
          informationRequest:
            $ref: '#/$defs/InformationRequest'
          deadlineKind:
            const: INFO
          actionDeadline:
            $ref: '#/$defs/Timestamp'
    - if:
        properties:
          status:
            const: OFFER_READY
      then:
        properties:
          decision:
            allOf:
            - $ref: '#/$defs/DecisionResult'
            - properties:
                outcome:
                  const: APPROVED
          deadlineKind:
            const: OFFER
          actionDeadline:
            $ref: '#/$defs/Timestamp'
    - if:
        properties:
          status:
            const: AWAITING_SIGNATURE
      then:
        properties:
          agreement:
            $ref: '#/$defs/AgreementSummary'
          deadlineKind:
            const: SIGNATURE
          actionDeadline:
            $ref: '#/$defs/Timestamp'
    - if:
        properties:
          status:
            const: MANUAL_REVIEW
      then:
        properties:
          manualReview:
            $ref: '#/$defs/ManualReviewCase'
    - if:
        properties:
          status:
            enum:
            - SIGNED
            - DISBURSING
            - DISBURSED
      then:
        properties:
          agreement:
            allOf:
            - $ref: '#/$defs/AgreementSummary'
            - properties:
                status:
                  const: SIGNED
          acceptedOffer:
            $ref: '#/$defs/AcceptedOffer'
    - if:
        properties:
          status:
            const: DISBURSED
      then:
        properties:
          disbursement:
            $ref: '#/$defs/Disbursement'
    - if:
        properties:
          status:
            not:
              enum:
              - NEEDS_INFO
              - OFFER_READY
              - AWAITING_SIGNATURE
      then:
        properties:
          deadlineKind:
            type: 'null'
          actionDeadline:
            type: 'null'
    - if:
        properties:
          status:
            enum:
            - DISBURSED
            - REJECTED
            - CANCELLED
            - EXPIRED
      then:
        properties:
          processing:
            type: 'null'
          technicalError:
            type: 'null'
          availableActions:
            maxItems: 0
    - if:
        properties:
          status:
            const: IN_REVIEW
          reviewStage:
            const: SCORING
      then:
        properties:
          verification:
            allOf:
            - $ref: '#/$defs/VerificationResult'
            - properties:
                outcome:
                  const: COMPLETE
                confirmed:
                  const: true
    - if:
        properties:
          status:
            enum:
            - OFFER_READY
            - OFFER_ACCEPTED
            - AWAITING_SIGNATURE
            - SIGNED
            - DISBURSING
            - DISBURSED
      then:
        properties:
          verification:
            allOf:
            - $ref: '#/$defs/VerificationResult'
            - properties:
                outcome:
                  const: COMPLETE
                confirmed:
                  const: true
          decision:
            allOf:
            - $ref: '#/$defs/DecisionResult'
            - properties:
                outcome:
                  const: APPROVED
    - if:
        properties:
          status:
            enum:
            - OFFER_ACCEPTED
            - AWAITING_SIGNATURE
      then:
        properties:
          acceptedOffer:
            $ref: '#/$defs/AcceptedOffer'
