server.address=0.0.0.0
server.port=${PORT:8006}
spring.datasource.url=${DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.parser.strict-duplicate-detection=true
spring.mvc.log-resolved-exception=false
spring.web.resources.add-mappings=false
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=WARN
logging.level.ru.alfa.disbursement=INFO
