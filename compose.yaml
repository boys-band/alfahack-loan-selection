x-runtime: &runtime
  restart: unless-stopped
  networks: [database]
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    extends:
      file: database/compose.yaml
      service: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: demo-admin-only
      APPLICATIONS_DB_PASSWORD: demo-applications-only
      CATALOG_DB_PASSWORD: demo-catalog-only
      VERIFICATION_DB_PASSWORD: demo-verification-only
      DECISION_DB_PASSWORD: demo-decision-only
      AGREEMENTS_DB_PASSWORD: demo-agreements-only
      DISBURSEMENT_DB_PASSWORD: demo-disbursement-only

  migrate:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    networks: [database]
    environment:
      PGPASSWORD: demo-admin-only
    volumes:
      - ./services:/schema/services:ro
      - ./infra/migrate.sh:/migrate.sh:ro
    entrypoint: [bash, /migrate.sh]
    depends_on:
      postgres:
        condition: service_healthy

  applications:
    <<: *runtime
    build:
      context: ./services/applications
      network: host
      additional_contexts:
        gradle-dist: ./gradle-dist
    image: alfa-applications:local-docker
    environment:
      DATABASE_URL: postgresql://applications_app:demo-applications-only@postgres:5432/alfa_applications
      PORT: 8001
      INTERNAL_API_TOKEN: demo-internal-only
      DEMO_CUSTOMER_TOKEN: demo-customer-only
      DEMO_STAFF_TOKEN: demo-staff-only
      CATALOG_URL: http://catalog:8002
      VERIFICATION_URL: http://verification:8003
      DECISION_URL: http://decision:8004
      AGREEMENTS_URL: http://agreements:8005
      DISBURSEMENT_URL: http://disbursement:8006
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8001; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  catalog:
    <<: *runtime
    build:
      context: ./services/catalog
      network: host
      additional_contexts:
        gradle-dist: ./gradle-dist
    image: alfa-catalog:local-docker
    environment:
      DATABASE_URL: postgresql://catalog_app:demo-catalog-only@postgres:5432/alfa_catalog
      PORT: 8002
      INTERNAL_API_TOKEN: demo-internal-only
      DEMO_CUSTOMER_TOKEN: demo-customer-only
      DEMO_ADMIN_TOKEN: demo-product-admin-only
      DEMO_ADMIN_ID: 00000000-0000-4000-8000-000000000099
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8002; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  verification:
    <<: *runtime
    build:
      context: ./services/verification
      network: host
      additional_contexts:
        gradle-dist: ./gradle-dist
    image: alfa-verification:local-docker
    environment:
      DATABASE_URL: postgresql://verification_app:demo-verification-only@postgres:5432/alfa_verification
      PORT: 8003
      INTERNAL_API_TOKEN: demo-internal-only
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8003; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  decision:
    <<: *runtime
    build:
      context: ./services/decision
      network: host
      additional_contexts:
        gradle-dist: ./gradle-dist
    image: alfa-decision:local-docker
    environment:
      DATABASE_URL: postgresql://decision_app:demo-decision-only@postgres:5432/alfa_decision
      PORT: 8004
      INTERNAL_API_TOKEN: demo-internal-only
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8004; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  agreements:
    <<: *runtime
    build:
      context: ./services/agreements
      network: host
      additional_contexts:
        gradle-dist: ./gradle-dist
    image: alfa-agreements:local-docker
    environment:
      DATABASE_URL: postgresql://agreements_app:demo-agreements-only@postgres:5432/alfa_agreements
      PORT: 8005
      INTERNAL_API_TOKEN: demo-internal-only
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8005; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  disbursement:
    <<: *runtime
    build:
      context: ./services/disbursement
      network: host
      additional_contexts:
        gradle-dist: ./gradle-dist
    image: alfa-disbursement:local-docker
    environment:
      DATABASE_URL: postgresql://disbursement_app:demo-disbursement-only@postgres:5432/alfa_disbursement
      PORT: 8006
      INTERNAL_API_TOKEN: demo-internal-only
      AGREEMENTS_URL: http://agreements:8005
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8006; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  worker:
    <<: *runtime
    image: alfa-applications:local-docker
    pull_policy: never
    command: [worker]
    environment:
      DATABASE_URL: postgresql://applications_app:demo-applications-only@postgres:5432/alfa_applications
      INTERNAL_API_TOKEN: demo-internal-only
      DEMO_CUSTOMER_TOKEN: demo-customer-only
      DEMO_STAFF_TOKEN: demo-staff-only
      CATALOG_URL: http://catalog:8002
      VERIFICATION_URL: http://verification:8003
      DECISION_URL: http://decision:8004
      AGREEMENTS_URL: http://agreements:8005
      DISBURSEMENT_URL: http://disbursement:8006
    depends_on:
      applications:
        condition: service_healthy
      catalog:
        condition: service_healthy
      verification:
        condition: service_healthy
      decision:
        condition: service_healthy
      agreements:
        condition: service_healthy
      disbursement:
        condition: service_healthy

  frontend:
    <<: *runtime
    build:
      context: ./frontend
      network: host
    image: alfa-frontend:local-docker
    environment:
      API_BASE_URL: /api
      MOCK_API: "false"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/config.js').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    networks: [database]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      applications:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
networks:
  database:
