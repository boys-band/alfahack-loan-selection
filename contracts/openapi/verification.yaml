openapi: 3.1.0
info:
  title: Обогащение и согласование фактов
  version: 2.0.0
  description: Контракт по docs/application-state-model.md. V1 заменен до реализации.
    Общие правила — contracts/README.md.
servers:
- url: http://verification:8003
  description: Внутренняя Docker-сеть
security:
- InternalBearer: []
paths:
  /v2/verifications:
    post:
      operationId: createVerification
      summary: Сохранить Verification
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '201':
          description: Ресурс создан.
          headers:
            X-Request-Id:
              schema:
                $ref: ../schemas.yaml#/$defs/Uuid
          content:
            application/json:
              schema:
                $ref: ../schemas.yaml#/$defs/VerificationResult
        '200':
          description: Результат сохранен или прочитан.
          headers:
            X-Request-Id:
              schema:
                $ref: ../schemas.yaml#/$defs/Uuid
          content:
            application/json:
              schema:
                $ref: ../schemas.yaml#/$defs/VerificationResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas.yaml#/$defs/VerificationRequest
  /v2/verifications/{verificationId}:
    get:
      operationId: getVerification
      summary: Прочитать Verification
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: verificationId
        in: path
        required: true
        schema:
          $ref: ../schemas.yaml#/$defs/Uuid
      responses:
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '200':
          description: Результат сохранен или прочитан.
          headers:
            X-Request-Id:
              schema:
                $ref: ../schemas.yaml#/$defs/Uuid
          content:
            application/json:
              schema:
                $ref: ../schemas.yaml#/$defs/VerificationResult
  /health/live:
    get:
      operationId: verificationHealthLive
      summary: Health live
      security: []
      responses:
        '200':
          description: Результат сохранен или прочитан.
          headers:
            X-Request-Id:
              schema:
                $ref: ../schemas.yaml#/$defs/Uuid
          content:
            application/json:
              schema:
                $ref: ../schemas.yaml#/$defs/Health
    servers:
    - url: http://verification:8003
      description: Внутренняя Docker-сеть
  /health/ready:
    get:
      operationId: verificationHealthReady
      summary: Health ready
      security: []
      responses:
        '200':
          description: Результат сохранен или прочитан.
          headers:
            X-Request-Id:
              schema:
                $ref: ../schemas.yaml#/$defs/Uuid
          content:
            application/json:
              schema:
                $ref: ../schemas.yaml#/$defs/Health
        '503':
          $ref: '#/components/responses/Error503'
    servers:
    - url: http://verification:8003
      description: Внутренняя Docker-сеть
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      description: Внутренний секрет; токены клиента/сотрудника не подходят
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        $ref: ../schemas.yaml#/$defs/Uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9:_.-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Непрозрачный ETag представления; передавать дословно.
      schema:
        type: string
        pattern: ^"[0-9a-f]{64}"$
  responses:
    Error400:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error401:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error403:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error404:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error409:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Секунды до повтора; при 409 только IDEMPOTENCY_IN_PROGRESS.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error412:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error422:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error428:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error429:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Секунды до повтора; при 409 только IDEMPOTENCY_IN_PROGRESS.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error500:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
    Error503:
      description: Ошибка.
      headers:
        X-Request-Id:
          schema:
            $ref: ../schemas.yaml#/$defs/Uuid
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Секунды до повтора; при 409 только IDEMPOTENCY_IN_PROGRESS.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas.yaml#/$defs/Problem
